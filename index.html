<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>Temperature Converter</title>
</head>
<body>
    <div class="box">
        <h1 class="heading">Temperature Converter</h1>
        <div class="temp-box">
            <label for="celsiusInput">Celsius:</label>
            <input type="number" id="celsiusInput" class="input" placeholder="Enter Temperature"> 
        </div> 
        <div class="temp-box">
            <label for="fahrenheitInput">Fahrenheit:</label>
            <input type="number" id="fahrenheitInput" class="input" placeholder="Enter Temperature">
        </div>
        <div class="temp-box">
            <label for="kelvinInput">Kelvin:</label>
            <input type="number" id="kelvinInput" class="input" placeholder="Enter Temperature">
        </div>
    </div>
</body>
</html>
